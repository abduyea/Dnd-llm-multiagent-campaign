services:
  ollama:
    image: ollama/ollama:latest
    container_name: dnd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pull-models:
    image: ollama/ollama:latest
    container_name: dnd-pull-models
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      sh -c "ollama pull qwen3 && ollama pull mistral-nemo && ollama pull llama3.2:3b && echo 'All models pulled'"
    profiles:
      - init

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnd-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:////data/dnd.db
      - CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - dnd_data:/data
      - ./backend:/app/backend
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: dnd-frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  dnd_data:
  ollama_data:
